<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stickman 4P - Arena</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #050508; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }

    /* ESTILO PANTALLA INICIO (Igual a la imagen 2) */
    #auth-screen {
      position: relative;
      width: 420px;
      background: rgba(10, 15, 26, 0.95);
      border: 1px solid #17a2b8;
      box-shadow: 0 0 20px rgba(23, 162, 184, 0.3);
      border-radius: 4px;
      padding: 30px;
      text-align: center;
      z-index: 10;
    }
    #auth-screen h2 { color: #00f0ff; letter-spacing: 2px; font-size: 24px; margin-bottom: 5px; }
    #auth-screen p.sub { color: #8899a6; font-size: 11px; letter-spacing: 1.5px; margin-bottom: 25px; text-transform: uppercase; }

    .tabs { display: flex; justify-content: space-around; margin-bottom: 20px; border-bottom: 1px solid #1c2d42; }
    .tab { background: none; border: none; color: #8899a6; font-weight: bold; font-size: 13px; padding: 8px 15px; cursor: pointer; letter-spacing: 1px; }
    .tab.active { color: #ff2a70; border-bottom: 2px solid #ff2a70; }

    .form-group { text-align: left; margin-bottom: 15px; }
    .form-group label { display: block; color: #00f0ff; font-size: 10px; font-weight: bold; letter-spacing: 1px; margin-bottom: 5px; text-transform: uppercase; }
    .form-group input { width: 100%; background: #08101a; border: 1px solid #1c2d42; color: #fff; padding: 10px; border-radius: 3px; outline: none; }
    .form-group input:focus { border-color: #00f0ff; }

    .btn-submit { width: 100%; padding: 12px; background: linear-gradient(90deg, #ff0055, #ff5e00); border: none; color: #fff; font-weight: bold; font-size: 14px; letter-spacing: 1px; cursor: pointer; border-radius: 3px; margin-top: 10px; }
    .btn-submit:hover { opacity: 0.9; }

    #error-msg { color: #ff4757; font-size: 12px; margin-top: 15px; display: none; }

    /* DECORACIÓN MONITOS EN PANTALLA INICIO */
    .stickmen-decor { position: absolute; bottom: -45px; left: 0; width: 100%; display: flex; justify-content: center; gap: 40px; }
    .stickman-svg { width: 25px; height: 40px; }

    /* ESTILO JUEGO (Igual a la imagen 1) */
    #game-container { display: none; flex-direction: column; align-items: center; }
    .scoreboard { display: flex; gap: 10px; background: rgba(10, 15, 26, 0.8); border: 1px solid #17a2b8; padding: 10px; border-radius: 4px; margin-bottom: 10px; width: 800px; }
    .p-card { flex: 1; background: #08101a; padding: 6px; border-radius: 3px; text-align: center; font-size: 12px; border: 1px solid #1c2d42; }
    .p-card .hp-bar { height: 8px; background: #222; margin-top: 5px; border-radius: 2px; overflow: hidden; }
    .p-card .hp-fill { height: 100%; width: 100%; background: #ff2a70; transition: width 0.15s; }

    canvas { background: #0d131d; border: 1px solid #17a2b8; box-shadow: 0 0 15px rgba(23, 162, 184, 0.2); }
    .map-title { color: #00f0ff; margin-bottom: 6px; font-weight: bold; font-size: 13px; letter-spacing: 1px; }
    .controls-hint { margin-top: 12px; color: #ff2a70; font-size: 12px; font-weight: bold; text-align: center; letter-spacing: 0.5px; }
    .btn-abandonar { margin-top: 8px; background: none; border: none; color: #8899a6; font-size: 11px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
  </style>
</head>
<body>

  <!-- PANTALLA DE INICIO IDÉNTICA A LA IMAGEN 2 -->
  <div id="auth-screen">
    <h2>ACCESO ARENA</h2>
    <p class="sub">Ingresa tus datos para luchar</p>

    <div class="tabs">
      <button class="tab active" id="tab-login" onclick="setTab('login')">LOGIN</button>
      <button class="tab" id="tab-reg" onclick="setTab('register')">REGISTRO</button>
    </div>

    <form id="auth-form" onsubmit="handleSubmit(event)">
      <div class="form-group">
        <label>Usuario</label>
        <input type="text" id="username" required autocomplete="off">
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="password" required>
      </div>

      <button type="submit" class="btn-submit" id="btn-text">CREAR CUENTA →</button>
    </form>

    <div id="error-msg">Error de conexión con el servidor</div>

    <div class="stickmen-decor">
      <svg class="stickman-svg" viewBox="0 0 50 100">
        <circle cx="25" cy="15" r="10" stroke="#ff0055" stroke-width="4" fill="none"/>
        <line x1="25" y1="25" x2="25" y2="60" stroke="#ff0055" stroke-width="4"/>
        <line x1="25" y1="35" x2="5" y2="20" stroke="#ff0055" stroke-width="4"/>
        <line x1="25" y1="60" x2="10" y2="95" stroke="#ff0055" stroke-width="4"/>
      </svg>
      <svg class="stickman-svg" viewBox="0 0 50 100">
        <circle cx="25" cy="15" r="10" stroke="#00f0ff" stroke-width="4" fill="none"/>
        <line x1="25" y1="25" x2="25" y2="60" stroke="#00f0ff" stroke-width="4"/>
        <line x1="25" y1="35" x2="45" y2="20" stroke="#00f0ff" stroke-width="4"/>
        <line x1="25" y1="60" x2="40" y2="95" stroke="#00f0ff" stroke-width="4"/>
      </svg>
    </div>
  </div>

  <!-- JUEGO IDÉNTICO A LA IMAGEN 1 -->
  <div id="game-container">
    <div class="scoreboard" id="scoreboard"></div>
    <div class="map-title" id="map-name">🗺️ MAPA: Arena Clásica</div>
    <canvas id="canvas" width="800" height="450"></canvas>
    <div class="controls-hint" id="controls-label">CONTROLANDO P1 - CONTROLES: WASD / FLECHAS + ESPACIO</div>
    <button class="btn-abandonar" onclick="location.reload()">🚪 ABANDONAR ARENA</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let mode = 'register';
    let myRole = 1;
    let keys = { left: false, right: false, up: false, attack: false };

    function setTab(m) {
      mode = m;
      document.getElementById('tab-login').classList.toggle('active', m === 'login');
      document.getElementById('tab-reg').classList.toggle('active', m === 'register');
      document.getElementById('btn-text').innerText = m === 'login' ? 'INICIAR SESIÓN →' : 'CREAR CUENTA →';
      document.getElementById('error-msg').style.display = 'none';
    }

    async function handleSubmit(e) {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('error-msg');

      try {
        const res = await fetch(`/api/${mode}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok) {
          document.getElementById('auth-screen').style.display = 'none';
          document.getElementById('game-container').style.display = 'flex';
          socket.emit('setName', username);
        } else {
          errorDiv.innerText = data.error || 'Error de autenticación';
          errorDiv.style.display = 'block';
        }
      } catch (err) {
        errorDiv.innerText = 'Error de conexión con el servidor';
        errorDiv.style.display = 'block';
      }
    }

    window.addEventListener('keydown', e => {
      if (['ArrowLeft', 'a', 'A'].includes(e.key)) keys.left = true;
      if (['ArrowRight', 'd', 'D'].includes(e.key)) keys.right = true;
      if (['ArrowUp', 'w', 'W'].includes(e.key)) keys.up = true;
      if (e.code === 'Space') keys.attack = true;
      socket.emit('input', keys);
    });

    window.addEventListener('keyup', e => {
      if (['ArrowLeft', 'a', 'A'].includes(e.key)) keys.left = false;
      if (['ArrowRight', 'd', 'D'].includes(e.key)) keys.right = false;
      if (['ArrowUp', 'w', 'W'].includes(e.key)) keys.up = false;
      if (e.code === 'Space') keys.attack = false;
      socket.emit('input', keys);
    });

    socket.on('init', data => {
      myRole = data.role;
      document.getElementById('controls-label').innerText = `CONTROLANDO P${myRole} - CONTROLES: WASD / FLECHAS + ESPACIO`;
    });

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // DIBUJAR ARMA SEGÚN TIPO EN MANOS DEL PERSONAJE
    function renderizarArma(x, y, dir, arma) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(dir, 1);

      ctx.lineWidth = 2;
      ctx.strokeStyle = '#ffffff';
      ctx.fillStyle = '#ffffff';

      switch(arma) {
        case 'Espada':
          ctx.strokeStyle = '#e0e0e0';
          ctx.beginPath();
          ctx.moveTo(10, 0);
          ctx.lineTo(30, -5); // Hoja brillante
          ctx.stroke();
          ctx.fillRect(8, -3, 3, 6); // Guardamanos
          break;

        case 'Fusil':
          ctx.fillStyle = '#fbc02d';
          ctx.fillRect(8, -3, 16, 5); // Cuerpo
          ctx.fillRect(24, -2, 10, 2); // Cañón
          ctx.fillRect(12, 2, 4, 6); // Cargador
          break;

        case 'Subfusil':
          ctx.fillStyle = '#ff9800';
          ctx.fillRect(8, -4, 12, 6); // Compacto
          ctx.fillRect(20, -2, 6, 2); // Cañón
          ctx.fillRect(14, 2, 3, 7); // Cargador largo
          break;

        case 'Escopeta':
          ctx.fillStyle = '#e91e63';
          ctx.fillRect(6, -2, 18, 5); // Cañón doble ancho
          ctx.fillStyle = '#795548';
          ctx.fillRect(0, 0, 8, 4); // Culata de madera
          break;

        case 'Francotirador':
          ctx.fillStyle = '#00e5ff';
          ctx.fillRect(6, -2, 14, 4); // Cuerpo
          ctx.fillRect(20, -1, 16, 2); // Cañón muy largo
          ctx.fillRect(12, -5, 6, 2); // Mira telescópica
          break;

        case 'Gancho':
          ctx.fillStyle = '#00e676';
          ctx.fillRect(8, -3, 10, 5);
          ctx.beginPath();
          ctx.arc(20, -1, 4, 0, Math.PI * 1.5); // Garfio del gancho
          ctx.stroke();
          break;
      }
      ctx.restore();
    }

    socket.on('estadoJuego', estado => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      document.getElementById('map-name').innerText = `🗺️ MAPA: ${estado.mapa.nombre}`;

      // 1. DIBUJAR PLATAFORMAS
      ctx.fillStyle = '#182232';
      estado.mapa.plataformas.forEach(plat => {
        ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
        ctx.strokeStyle = '#17a2b8';
        ctx.lineWidth = 1;
        ctx.strokeRect(plat.x, plat.y, plat.w, plat.h);
      });

      // 2. DIBUJAR ARMAS EN EL SUELO (BOLITAS BRILLANTES CADA 5s)
      (estado.itemsArmas || []).forEach(item => {
        ctx.beginPath();
        ctx.arc(item.x, item.y, 9, 0, Math.PI * 2);
        ctx.fillStyle = item.color;
        ctx.shadowColor = item.color;
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.fillStyle = '#ffffff';
        ctx.font = '10px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(item.arma, item.x, item.y - 13);
      });

      // 3. DIBUJAR PROYECTILES Y DISPAROS
      (estado.proyectiles || []).forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.tipo === 'escopeta' ? 3 : 4, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 8;
        ctx.fill();
        ctx.shadowBlur = 0;
      });

      // 4. DIBUJAR EFECTOS DE CORTE (ESPADA)
      (estado.efectosAtaque || []).forEach(ef => {
        ctx.beginPath();
        ctx.arc(ef.x, ef.y, 25, ef.facing === 1 ? -Math.PI / 3 : Math.PI * 0.7, ef.facing === 1 ? Math.PI / 3 : Math.PI * 1.3);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 4;
        ctx.stroke();
      });

      // 5. SCOREBOARD SUPERIOR Y JUGADORES
      const scoreboard = document.getElementById('scoreboard');
      scoreboard.innerHTML = '';

      // Crear slots para P1, P2, P3, P4
      for (let r = 1; r <= 4; r++) {
        const p = Object.values(estado.players).find(x => x.role === r);
        const card = document.createElement('div');
        card.className = 'p-card';

        if (p) {
          card.innerHTML = `
            <div style="color: ${p.color}; font-weight: bold;">P${p.role}: ${p.score}</div>
            <div class="hp-bar"><div class="hp-fill" style="width: ${p.health}%; background: ${p.color}"></div></div>
            <div style="color: #8899a6; font-size: 10px; margin-top: 3px;">${p.arma}</div>
          `;
        } else {
          card.innerHTML = `
            <div style="color: #445566; font-weight: bold;">P${r}: -</div>
            <div class="hp-bar"><div class="hp-fill" style="width: 0%;"></div></div>
            <div style="color: #445566; font-size: 10px; margin-top: 3px;">Esperando...</div>
          `;
        }
        scoreboard.appendChild(card);
      }

      // Dibujar los Monitos Stickmen
      Object.values(estado.players).forEach(p => {
        if (p.role > 4) return;

        // Cabeza
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(p.x, p.y - 25, 8, 0, Math.PI * 2);
        ctx.stroke();

        // Cuerpo
        ctx.beginPath();
        ctx.moveTo(p.x, p.y - 17);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();

        // Piernas
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - 7, p.y + 15);
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x + 7, p.y + 15);
        ctx.stroke();

        // Brazos
        ctx.beginPath();
        ctx.moveTo(p.x, p.y - 12);
        ctx.lineTo(p.x + (p.facing * 10), p.y - 8);
        ctx.stroke();

        // Dibujar Arma detallada
        renderizarArma(p.x, p.y - 10, p.facing, p.arma);

        // Nombre encima
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 11px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(p.name, p.x, p.y - 38);
      });
    });
  </script>
</body>
</html>
