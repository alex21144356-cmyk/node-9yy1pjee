<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Stickman — Arcade Edition</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: #05070a;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: #ffffff;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        overflow-x: hidden;
      }

      /* Estilos para Tarjetas Neón */
      .glass-card {
        width: 440px;
        max-width: 90vw;
        background: rgba(10, 14, 26, 0.85);
        border: 2px solid rgba(0, 240, 255, 0.4);
        border-radius: 8px;
        padding: 30px;
        box-shadow: 0 0 25px rgba(0, 240, 255, 0.2);
        text-align: center;
        margin: 20px 0;
      }

      h2 { color: #00f0ff; letter-spacing: 2px; margin-top: 0; text-transform: uppercase; }
      .card-sub { color: #a0aec0; font-size: 12px; margin-bottom: 20px; }

      .screen { display: none; flex-direction: column; align-items: center; width: 100%; }
      .screen.active { display: flex; }

      /* Botones Estilizados */
      .arcade-btn, .menu-btn, .auth-submit {
        background: linear-gradient(90deg, #00f0ff, #0077ff);
        color: #000;
        font-weight: bold;
        border: none;
        padding: 12px 20px;
        cursor: pointer;
        text-transform: uppercase;
        border-radius: 4px;
        width: 100%;
        margin-top: 10px;
        transition: transform 0.1s ease;
      }
      .arcade-btn:hover, .menu-btn:hover { transform: scale(1.02); filter: brightness(1.1); }
      
      .secondary {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      .field-input {
        width: 100%;
        padding: 10px;
        margin: 6px 0 12px 0;
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(0, 240, 255, 0.3);
        color: #fff;
        border-radius: 4px;
      }

      /* Tabla Estilizada */
      table { width: 100%; border-collapse: collapse; margin-top: 15px; }
      th, td { padding: 10px; text-align: left; border-bottom: 1px solid rgba(255, 255, 255, 0.1); font-size: 13px; }
      th { color: #00f0ff; text-transform: uppercase; }

      .link-btn { background: none; border: none; color: #a0aec0; cursor: pointer; margin-top: 15px; text-decoration: underline; }
    </style>
  </head>
  <body>

    <!-- PANTALLA DE INICIO (LANDING) -->
    <div id="screen-landing" class="screen active">
      <div class="glass-card">
        <h2>Stickman Battle</h2>
        <div class="card-sub">Edicion Arena y Armeria</div>
        <button id="btn-entrar-landing" class="arcade-btn">Iniciar Sesion / Registrarse</button>
      </div>
    </div>

    <!-- PANTALLA DE AUTENTICACION -->
    <div id="screen-auth" class="screen">
      <div class="glass-card">
        <h2 id="auth-title">Acceso Arena</h2>
        <div class="card-sub">Ingresa tu usuario y contrasena</div>

        <form id="auth-form">
          <input id="auth-username" class="field-input" placeholder="Usuario" type="text" required />
          <input id="auth-password" class="field-input" placeholder="Contrasena" type="password" required />

          <button type="submit" id="auth-submit" class="auth-submit">Entrar</button>
        </form>
        <button id="btn-toggle-auth" class="link-btn">¿No tienes cuenta? Registrate</button>
      </div>
    </div>

    <!-- MENU PRINCIPAL (COTEJO: Menu interactivo) -->
    <div id="screen-menu" class="screen">
      <div class="glass-card">
        <h2>Menu Principal</h2>
        <div class="card-sub">Bienvenido: <b id="menu-username" style="color:#00f0ff">Jugador</b></div>

        <button id="btn-armeria" class="menu-btn">⚔️ Gestionar Armeria (CRUD)</button>
        <button id="btn-puntajes" class="menu-btn secondary">🏆 Tabla de Puntajes</button>
        <button id="menu-logout" class="link-btn">Cerrar Sesion</button>
      </div>
    </div>

    <!-- PANTALLA DE ARMERIA (CRUD COMPLETO) -->
    <div id="screen-armeria" class="screen">
      <div class="glass-card" style="width: 550px;">
        <h2>⚔️ Armeria (CRUD)</h2>
        <div class="card-sub" id="dano-recursivo-label">Dano Total Calculado: 0 DMG</div>

        <!-- Formulario Crear/Editar -->
        <div style="display:flex; gap:8px;">
          <input id="arma-nombre" class="field-input" placeholder="Nombre Arma" />
          <input id="arma-tipo" class="field-input" placeholder="Tipo" />
          <input id="arma-dano" class="field-input" type="number" placeholder="Dano" />
        </div>
        <button id="btn-guardar-arma" class="arcade-btn">Guardar Arma</button>

        <!-- Tabla de Armas de la BD -->
        <table id="tabla-armas">
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Tipo</th>
              <th>Dano</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>

        <button id="btn-volver-armeria" class="link-btn">← Volver al Menu</button>
      </div>
    </div>

    <!-- PANTALLA TABLA DE PUNTAJES -->
    <div id="screen-scores" class="screen">
      <div class="glass-card">
        <h2>🏆 Salón de la Fama</h2>
        <div class="card-sub">Top Puntuaciones</div>

        <table id="tabla-puntajes">
          <thead>
            <tr>
              <th>Pos.</th>
              <th>Jugador</th>
              <th>Puntos</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>

        <button id="btn-volver-scores" class="link-btn">← Volver al Menu</button>
      </div>
    </div>

    <script>
      // ================================================================
      // LOGICA FRONTEND DE INTERACCION
      //  Menu interactivo, Manipulacion de listas, Ciclos
      // ================================================================

      const SCREENS = ['screen-landing', 'screen-auth', 'screen-menu', 'screen-armeria', 'screen-scores'];
      function mostrarPantalla(id) {
        // Ciclos 
        for (let i = 0; i < SCREENS.length; i++) {
          document.getElementById(SCREENS[i]).classList.toggle('active', SCREENS[i] === id);
        }
      }

      let modoAuth = 'login';
      let editandoArmaId = null;

      // Botones de Navegacion
      document.getElementById('btn-entrar-landing').addEventListener('click', () => mostrarPantalla('screen-auth'));
      document.getElementById('btn-volver-armeria').addEventListener('click', () => mostrarPantalla('screen-menu'));
      document.getElementById('btn-volver-scores').addEventListener('click', () => mostrarPantalla('screen-menu'));

      // Cambio entre Login y Registro
      document.getElementById('btn-toggle-auth').addEventListener('click', () => {
        if (modoAuth === 'login') {
          modoAuth = 'registro';
          document.getElementById('auth-title').innerText = 'Crear Cuenta';
          document.getElementById('auth-submit').innerText = 'Registrar';
          document.getElementById('btn-toggle-auth').innerText = '¿Ya tienes cuenta? Inicia sesion';
        } else {
          modoAuth = 'login';
          document.getElementById('auth-title').innerText = 'Acceso Arena';
          document.getElementById('auth-submit').innerText = 'Entrar';
          document.getElementById('btn-toggle-auth').innerText = '¿No tienes cuenta? Registrate';
        }
      });

      // Peticion Auth
      document.getElementById('auth-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('auth-username').value;
        const password = document.getElementById('auth-password').value;
        const url = modoAuth === 'login' ? '/api/login' : '/api/register';

        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();
        if (res.ok) {
          document.getElementById('menu-username').innerText = data.username;
          mostrarPantalla('screen-menu');
        } else {
          alert(data.error || 'Error en autenticacion');
        }
      });

      // Cargar CRUD de Armas
      document.getElementById('btn-armeria').addEventListener('click', () => {
        mostrarPantalla('screen-armeria');
        cargarArmas();
      });

      async function cargarArmas() {
        const res = await fetch('/api/armas');
        const data = await res.json();

        document.getElementById('dano-recursivo-label').innerText = 'Dano Total Calculado (Recursion): ' + data.danoTotalCatalogo + ' DMG';
        
        const tbody = document.querySelector('#tabla-armas tbody');
        tbody.innerHTML = '';

        //  Manejo de arreglos y ciclos
        data.armas.forEach(arma => {
          tbody.innerHTML += `
            <tr>
              <td>${arma.nombre}</td>
              <td>${arma.tipo}</td>
              <td>${arma.dano} DMG</td>
              <td>
                <button onclick="prepararEdicion(${arma.id}, '${arma.nombre}', '${arma.tipo}', ${arma.dano})" style="color:#00f0ff; background:none; border:none; cursor:pointer;">Editar</button>
                <button onclick="eliminarArma(${arma.id})" style="color:#ff0055; background:none; border:none; cursor:pointer;">X</button>
              </td>
            </tr>
          `;
        });
      }

      // Guardar / Actualizar Arma (CRUD)
      document.getElementById('btn-guardar-arma').addEventListener('click', async () => {
        const nombre = document.getElementById('arma-nombre').value;
        const tipo = document.getElementById('arma-tipo').value;
        const dano = document.getElementById('arma-dano').value;

        if (!nombre || !tipo || !dano) return alert('Completa los campos');

        if (editandoArmaId) {
          await fetch('/api/armas/' + editandoArmaId, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nombre, tipo, dano })
          });
          editandoArmaId = null;
        } else {
          await fetch('/api/armas', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nombre, tipo, dano })
          });
        }

        document.getElementById('arma-nombre').value = '';
        document.getElementById('arma-tipo').value = '';
        document.getElementById('arma-dano').value = '';
        cargarArmas();
      });

      function prepararEdicion(id, nombre, tipo, dano) {
        editandoArmaId = id;
        document.getElementById('arma-nombre').value = nombre;
        document.getElementById('arma-tipo').value = tipo;
        document.getElementById('arma-dano').value = dano;
      }

      async function eliminarArma(id) {
        await fetch('/api/armas/' + id, { method: 'DELETE' });
        cargarArmas();
      }

      // Cargar Tabla de Puntajes
      document.getElementById('btn-puntajes').addEventListener('click', async () => {
        mostrarPantalla('screen-scores');
        const res = await fetch('/api/ganadores');
        const data = await res.json();
        const tbody = document.querySelector('#tabla-puntajes tbody');
        tbody.innerHTML = '';

        data.forEach((g, index) => {
          tbody.innerHTML += `
            <tr>
              <td>#${index + 1}</td>
              <td>${g.nombre}</td>
              <td style="color:#00f0ff; font-weight:bold;">${g.puntuacion} pts</td>
            </tr>
          `;
        });
      });

      // Logout
      document.getElementById('menu-logout').addEventListener('click', async () => {
        await fetch('/api/logout', { method: 'POST' });
        mostrarPantalla('screen-landing');
      });
    </script>
  </body>
</html>
