<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Stickman Battle — 4 Players Arena</title>
    <!-- Incluimos Socket.io para la sincronización en tiempo real -->
    <script src="/socket.io/socket.io.js"></script>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: #05070a;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: #ffffff;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        overflow: hidden;
      }

      .screen { display: none; flex-direction: column; align-items: center; width: 100%; z-index: 10; }
      .screen.active { display: flex; }

      .glass-card {
        position: relative;
        z-index: 10;
        width: 500px;
        max-width: 90vw;
        background: rgba(10, 14, 26, 0.92);
        border: 2px solid rgba(0, 240, 255, 0.4);
        border-radius: 8px;
        padding: 30px;
        box-shadow: 0 0 25px rgba(0, 240, 255, 0.25);
        text-align: center;
        backdrop-filter: blur(8px);
      }

      h2 { color: #00f0ff; letter-spacing: 2px; margin-top: 0; text-transform: uppercase; }
      .card-sub { color: #a0aec0; font-size: 13px; margin-bottom: 20px; }

      .arcade-btn, .menu-btn {
        background: linear-gradient(90deg, #00f0ff, #0077ff);
        color: #000;
        font-weight: bold;
        border: none;
        padding: 12px 20px;
        cursor: pointer;
        text-transform: uppercase;
        border-radius: 4px;
        width: 100%;
        margin-top: 10px;
        transition: transform 0.1s ease;
      }
      .btn-play {
        background: linear-gradient(90deg, #ff0055, #ff5500);
        color: #fff;
        font-size: 18px;
        box-shadow: 0 0 15px rgba(255, 0, 85, 0.5);
      }
      .secondary { background: rgba(255, 255, 255, 0.1); color: #fff; border: 1px solid rgba(255, 255, 255, 0.2); }
      .arcade-btn:hover, .menu-btn:hover { transform: scale(1.02); filter: brightness(1.1); }

      .field-input {
        width: 100%; padding: 10px; margin: 6px 0 12px 0;
        background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(0, 240, 255, 0.3);
        color: #fff; border-radius: 4px;
      }

      /* CANVAS DE LA ARENA (PANTALLA COMPLETA) */
      #screen-game {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 50; background: #05070a;
      }
      #game-canvas { width: 100vw; height: 100vh; display: block; }

      .game-ui-overlay {
        position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 60;
      }

      /* Lista de Jugadores en Sala */
      .lobby-players {
        background: rgba(0,0,0,0.4); border-radius: 6px; padding: 10px; margin: 15px 0; text-align: left;
      }
      .player-badge { display: inline-block; padding: 4px 10px; margin: 4px; border-radius: 4px; font-weight: bold; font-size: 12px; }
    </style>
  </head>
  <body>

    <!-- 1. LANDING Y LOGIN -->
    <div id="screen-auth" class="screen active">
      <div class="glass-card">
        <h2>Stickman Arena (4 Jugadores)</h2>
        <div class="card-sub">Ingresa tu apodo para unirte a la partida compartida</div>
        <form id="auth-form">
          <input id="auth-username" class="field-input" placeholder="Tu Nombre / Nickname" type="text" required />
          <button type="submit" class="arcade-btn">Entrar a la Sala</button>
        </form>
      </div>
    </div>

    <!-- 2. LOBBY / MENU -->
    <div id="screen-menu" class="screen">
      <div class="glass-card">
        <h2>Sala de Espera (4P)</h2>
        <div class="card-sub">Comparte el enlace con tus amigos para que se unan</div>

        <div class="lobby-players">
          <div style="font-size: 12px; color: #a0aec0; margin-bottom: 5px;">Jugadores en Linea (<span id="player-count">1</span>/4):</div>
          <div id="players-list"></div>
        </div>

        <button id="btn-jugar" class="arcade-btn btn-play">🥊 ¡INICIAR PELEA EN ARENA!</button>
        <button id="menu-logout" class="arcade-btn secondary" style="margin-top:15px;">Cambiar Nombre</button>
      </div>
    </div>

    <!-- 3. ARENA DE JUEGO MULTIJUGADOR -->
    <div id="screen-game" class="screen">
      <canvas id="game-canvas"></canvas>
      <div class="game-ui-overlay">
        <button id="btn-salir-juego" class="arcade-btn secondary" style="padding: 8px 25px;">← Salir al Menu</button>
      </div>
    </div>

    <script>
      const socket = io(); // Conexión WebSocket para sincronizar 4 clientes
      const SCREENS = ['screen-auth', 'screen-menu', 'screen-game'];

      let miNombre = 'Jugador';
      let miSlot = 0; // P1, P2, P3 o P4
      let todosLosJugadores = {};

      const colores4P = ['#00f0ff', '#ff0055', '#00ff66', '#ffcc00']; // Azul, Rojo, Verde, Amarillo

      function mostrarPantalla(id) {
        SCREENS.forEach(s => document.getElementById(s).classList.toggle('active', s === id));
      }

      // 1. Unirse a la sala
      document.getElementById('auth-form').addEventListener('submit', (e) => {
        e.preventDefault();
        miNombre = document.getElementById('auth-username').value;
        socket.emit('unirse_sala', { nombre: miNombre });
        mostrarPantalla('screen-menu');
      });

      // Recibir lista de jugadores en tiempo real desde el servidor
      socket.on('actualizar_lobby', (jugadores) => {
        todosLosJugadores = jugadores;
        const listaDiv = document.getElementById('players-list');
        listaDiv.innerHTML = '';

        const keys = Object.keys(jugadores);
        document.getElementById('player-count').innerText = keys.length;

        keys.forEach((id, index) => {
          const p = jugadores[id];
          const color = colores4P[index % 4];
          listaDiv.innerHTML += `<span class="player-badge" style="background:${color}; color:#000;">P${index+1}: ${p.nombre}</span>`;
        });
      });

      // 2. Iniciar Arena de 4 Jugadores
      const gameCanvas = document.getElementById('game-canvas');
      const ctx = gameCanvas.getContext('2d');
      let gameInterval = null;
      let teclas = {};

      window.addEventListener('resize', resizeCanvas);
      function resizeCanvas() {
        gameCanvas.width = window.innerWidth;
        gameCanvas.height = window.innerHeight;
      }

      document.getElementById('btn-jugar').addEventListener('click', () => {
        socket.emit('iniciar_partida');
      });

      socket.on('empezar_juego', () => {
        mostrarPantalla('screen-game');
        resizeCanvas();
        if (gameInterval) clearInterval(gameInterval);
        gameInterval = setInterval(loopJuego, 1000 / 60);
      });

      window.addEventListener('keydown', (e) => {
        teclas[e.code] = true;
        enviarMovimiento();
      });
      window.addEventListener('keyup', (e) => {
        teclas[e.code] = false;
        enviarMovimiento();
      });

      function enviarMovimiento() {
        socket.emit('mover_jugador', {
          left: teclas['KeyA'] || teclas['ArrowLeft'],
          right: teclas['KeyD'] || teclas['ArrowRight'],
          attack: teclas['Space']
        });
      }

      // Sincronizar Estado de la Partida desde el servidor
      socket.on('estado_arena', (estado) => {
        todosLosJugadores = estado;
      });

      function dibujarStickman(x, y, color, atacando, dir = 1) {
        ctx.strokeStyle = color;
        ctx.lineWidth = 5;
        ctx.beginPath();

        // Cabeza
        ctx.arc(x, y - 60, 18, 0, Math.PI * 2);
        // Cuerpo
        ctx.moveTo(x, y - 42);
        ctx.lineTo(x, y);

        // Brazos
        if (atacando) {
          ctx.moveTo(x, y - 30);
          ctx.lineTo(x + 40 * dir, y - 30);
          ctx.strokeStyle = '#ffe600'; // Destello de arma/puño
          ctx.moveTo(x + 35 * dir, y - 45);
          ctx.lineTo(x + 65 * dir, y - 20);
          ctx.strokeStyle = color;
        } else {
          ctx.moveTo(x, y - 30); ctx.lineTo(x + 20 * dir, y - 10);
          ctx.moveTo(x, y - 30); ctx.lineTo(x - 20 * dir, y - 10);
        }

        // Piernas
        ctx.moveTo(x, y); ctx.lineTo(x + 18, y + 45);
        ctx.moveTo(x, y); ctx.lineTo(x - 18, y + 45);
        ctx.stroke();
      }

      function loopJuego() {
        const sueloY = gameCanvas.height - 120;

        // Limpiar Pantalla
        ctx.fillStyle = '#05070a';
        ctx.fillRect(0, 0, gameCanvas.width, gameCanvas.height);

        // Dibujar Suelo Neón
        ctx.strokeStyle = '#00f0ff';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, sueloY + 45);
        ctx.lineTo(gameCanvas.width, sueloY + 45);
        ctx.stroke();

        // HUD: BARRAS DE VIDA SUPERIORES PARA LOS 4 JUGADORES
        const ids = Object.keys(todosLosJugadores);
        const barWidth = Math.min(180, (gameCanvas.width / 4) - 30);

        ids.forEach((id, index) => {
          const p = todosLosJugadores[id];
          const color = colores4P[index % 4];
          const startX = 20 + index * (barWidth + 20);

          // Fondo barra
          ctx.fillStyle = '#111';
          ctx.fillRect(startX, 35, barWidth, 18);
          // Vida actual
          ctx.fillStyle = color;
          ctx.fillRect(startX, 35, Math.max(0, (p.hp / 100) * barWidth), 18);

          // Nombre encima
          ctx.fillStyle = '#fff';
          ctx.font = 'bold 13px sans-serif';
          ctx.fillText(`P${index+1}: ${p.nombre}`, startX, 25);
        });

        // DIBUJAR A CADA UNO DE LOS 4 JUGADORES EN LA ARENA
        ids.forEach((id, index) => {
          const p = todosLosJugadores[id];
          const color = colores4P[index % 4];
          const dir = index < 2 ? 1 : -1; // Los primeros ven a la derecha, los últimos a la izquierda

          dibujarStickman(p.x, sueloY, color, p.atacando, dir);

          // Nombre flotando sobre el Stickman
          ctx.fillStyle = color;
          ctx.font = '12px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(p.nombre, p.x, sueloY - 90);
          ctx.textAlign = 'left';
        });
      }

      document.getElementById('btn-salir-juego').addEventListener('click', () => {
        if (gameInterval) clearInterval(gameInterval);
        mostrarPantalla('screen-menu');
      });

      document.getElementById('menu-logout').addEventListener('click', () => {
        mostrarPantalla('screen-auth');
      });
    </script>
  </body>
</html>
