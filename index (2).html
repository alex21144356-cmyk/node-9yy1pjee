<script src="/socket.io/socket.io.js"></script>
<script>
  // ================================================================
  // 1. CONTROL DE PANTALLAS (NAVEGACION)
  // ================================================================
  const SCREENS = ['screen-landing', 'screen-auth', 'screen-menu', 'screen-scores', 'screen-game'];
  
  function mostrarSolo(id) {
    SCREENS.forEach((s) => {
      const el = document.getElementById(s);
      if (el) el.classList.toggle('active', s === id);
    });
  }

  let usuarioActual = null;

  // Boton inicial de la pantalla principal (Landing) para ir al Login
  document.getElementById('btn-entrar-landing').addEventListener('click', () => {
    mostrarSolo('screen-auth');
  });

  // Alternar entre pestañas Login y Registro
  let modoAuth = 'login';
  const tabLogin = document.getElementById('tab-login');
  const tabRegistro = document.getElementById('tab-registro');
  const authSubmitBtn = document.getElementById('auth-submit');
  const authErrorEl = document.getElementById('auth-error');

  tabLogin.addEventListener('click', () => {
    modoAuth = 'login';
    tabLogin.classList.add('active');
    tabRegistro.classList.remove('active');
    authSubmitBtn.innerText = 'Entrar →';
    authErrorEl.innerText = '';
  });

  tabRegistro.addEventListener('click', () => {
    modoAuth = 'registro';
    tabRegistro.classList.add('active');
    tabLogin.classList.remove('active');
    authSubmitBtn.innerText = 'Crear cuenta →';
    authErrorEl.innerText = '';
  });

  document.getElementById('btn-volver-auth').addEventListener('click', () => {
    mostrarSolo('screen-landing');
  });

  // ================================================================
  // 2. LOGICA DE INICIO DE SESION Y REGISTRO (CONEXION AL BACKEND)
  // ================================================================
  document.getElementById('auth-form').addEventListener('submit', async (e) => {
    e.preventDefault(); // Previene el recargo de la pagina
    
    const username = document.getElementById('auth-username').value.trim();
    const password = document.getElementById('auth-password').value.trim();
    authErrorEl.innerText = 'Procesando...';

    if (!username || !password) {
      authErrorEl.innerText = 'Ingresa usuario y contrasena';
      return;
    }

    const endpoint = modoAuth === 'login' ? '/api/login' : '/api/register';

    try {
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      const data = await res.json();

      if (!res.ok) {
        authErrorEl.innerText = data.error || 'Error en la solicitud';
        return;
      }

      // Si fue exitoso guardamos usuario y pasamos al menu
      usuarioActual = data.username;
      document.getElementById('menu-username').innerText = usuarioActual;
      document.getElementById('auth-password').value = '';
      authErrorEl.innerText = '';
      mostrarSolo('screen-menu');

    } catch (err) {
      authErrorEl.innerText = 'Error de conexion con el servidor';
    }
  });

  // ================================================================
  // 3. NAVEGACION DENTRO DEL MENU PRINCIPAL
  // ================================================================
  document.getElementById('btn-jugar').addEventListener('click', () => {
    mostrarSolo('screen-game');
    iniciarJuego();
  });

  document.getElementById('btn-puntajes').addEventListener('click', async () => {
    const lista = document.getElementById('scores-list');
    lista.innerHTML = '<div style="color:#a0aec0; padding:10px;">Cargando...</div>';
    mostrarSolo('screen-scores');

    try {
      const res = await fetch('/api/ganadores');
      const datos = await res.json();
      
      if (!datos.length) {
        lista.innerHTML = '<div style="color:#a0aec0; padding:10px;">Sin puntajes aun</div>';
        return;
      }

      lista.innerHTML = datos.map((g, i) => `
        <div class="score-row">
          <span class="score-pos">#${i + 1}</span>
          <span class="score-name">${g.nombre}</span>
          <span class="score-pts">${g.puntuacion} pts</span>
        </div>
      `).join('');
    } catch (err) {
      lista.innerHTML = '<div style="color:#ff0055; padding:10px;">Error al cargar</div>';
    }
  });

  document.getElementById('btn-volver-scores').addEventListener('click', () => {
    mostrarSolo('screen-menu');
  });

  document.getElementById('menu-logout').addEventListener('click', () => {
    usuarioActual = null;
    if (socket) {
      socket.disconnect();
      socket = null;
    }
    mostrarSolo('screen-landing');
  });

  document.getElementById('btn-salir-juego').addEventListener('click', () => {
    if (socket) {
      socket.disconnect();
      socket = null;
    }
    mostrarSolo('screen-menu');
  });

  // ================================================================
  // 4. CONEXION Y BUCLE DEL JUEGO (SOCKET.IO)
  // ================================================================
  let socket = null;
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  function iniciarJuego() {
    if (socket) return;
    socket = io();

    socket.on('init', (data) => {
      socket.emit('setName', usuarioActual || 'Jugador');
    });

    socket.on('estadoJuego', (estado) => {
      // Dibuja el escenario en canvas de 800x500
      ctx.fillStyle = '#0d111a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Suelo
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, 400, canvas.width, 100);

      // Dibujar jugadores
      Object.values(estado.players).forEach(p => {
        ctx.fillStyle = p.color || '#00f0ff';
        ctx.beginPath();
        ctx.arc(p.x, p.y - 20, 10, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = p.color || '#00f0ff';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y - 10);
        ctx.lineTo(p.x, p.y + 10);
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.font = '11px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(p.name, p.x, p.y - 35);
      });
    });

    // Enviar entradas de control al servidor
    window.addEventListener('keydown', (e) => {
      if (!socket) return;
      if (['ArrowLeft', 'a', 'A'].includes(e.key)) socket.emit('input', { left: true });
      if (['ArrowRight', 'd', 'D'].includes(e.key)) socket.emit('input', { right: true });
      if (['ArrowUp', 'w', 'W'].includes(e.key)) socket.emit('input', { up: true });
    });
  }
</script>
